name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0
      - uses: gradle/actions/setup-gradle@v5
      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          file=app/build.gradle.kts
          name=$(sed -nE 's/^ *versionName = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' "$file")
          code=$(sed -nE 's/^ *versionCode = ([0-9]+)$/\1/p' "$file")
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::versionName or versionCode not found in $file"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$name"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          sed -i -E "s/^( *versionName = )\"$name\"$/\1\"$version\"/; s/^( *versionCode = )$code$/\1$((code + 1))/" "$file"
          git diff --exit-code --quiet "$file" && { echo "::error::$file was not changed"; exit 1; }
          echo "$name ($code) -> $version ($((code + 1)))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Test and build signed APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "DictionarySync-v$VERSION.apk"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: reports
          path: app/build/reports
      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/v$VERSION"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "DictionarySync-v$VERSION.apk" \
            --title "DictionarySync v$VERSION" --generate-notes --verify-tag
